name: N.E.X.A Server CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Syntax & Compilation Check
        run: |
          echo "Checking syntax across codebase..."
          find src -name "*.js" -exec node -c {} +
          echo "All JavaScript files in src/ compiled cleanly!"

      - name: Run Upgrade Unit Tests
        run: node --test tests/upgrade.test.js
