name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Username pemilik token (akun pribadi):
          HF_AUTH_USER: Knightrelaxed
          # Pemilik/organisasi Space di HF:
          HF_SPACE_OWNER: nexa-asistant
          HF_SPACE_NAME: NEXA-Core-Server
        run: |
          git push --force https://$HF_AUTH_USER:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_OWNER/$HF_SPACE_NAME main
