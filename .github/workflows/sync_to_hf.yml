name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Push backend-only to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_AUTH_USER: Knightrelaxed
          HF_SPACE_OWNER: nexa-asistant
          HF_SPACE_NAME: NEXA-Core-Server
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          # Buat orphan branch (branch baru tanpa history masa lalu)
          git checkout --orphan hf-deploy-orphan

          # Bersihkan index git secara keseluruhan
          git rm -rf --cached .

          # Tambahkan semua file kembali ke staging
          git add .

          # Kecualikan folder frontend dari staging
          git reset nexa-finance-web/

          # Commit sebagai satu snapshot utuh (tanpa history)
          git commit -m "Deploy backend snapshot to HF Space"

          # Force push single commit ini ke HF
          git push --force https://$HF_AUTH_USER:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_OWNER/$HF_SPACE_NAME hf-deploy-orphan:main

